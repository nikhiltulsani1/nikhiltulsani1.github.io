<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#8da1c5" font-size="12"><text x="38" y="490">Conceptual workflow · not a production topology</text><text x="38" y="515" fill="#5bd4b7" font-weight="650">BUILD  /  VERIFY  /  IMPROVE</text></g>
