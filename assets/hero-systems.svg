 <text x="114" y="160" font-size="11" font-weight="650" fill="#97adcf">01 / INPUT</text><text x="71" y="196" font-size="19" font-weight="700" fill="#eef5ff">Specs &amp; data</text></g>
 <g><rect x="342" y="125" width="265" height="100" rx="13" fill="#223c58" stroke="#4d8c9b"/>
 <circle cx="365" cy="157" r="6" fill="#6be5cd"/><circle cx="390" cy="157" r="6" fill="#9baaff"/><path d="M370 157h14" stroke="#a2caca" stroke-width="2"/>
 <text x="410" y="161" font-size="11" font-weight="650" fill="#9dcac6">02 / BUILD</text><text x="365" y="196" font-size="19" font-weight="700" fill="#eef5ff">Agents / retrieval</text></g>
 <g><rect x="342" y="294" width="265" height="128" rx="13" fill="#23375a" stroke="#5f7bc4"/>
 <text x="365" y="326" font-size="11" font-weight="650" fill="#9babe2">03 / VERIFY</text><text x="365" y="357" font-size="19" font-weight="700" fill="#eef5ff">Evaluation gate</text>
 <path d="M365 382l8 8 16-19" stroke="#86f2c6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="403" y="388" font-size="12" fill="#bfd1e2">Tests, checks, traces</text></g>
