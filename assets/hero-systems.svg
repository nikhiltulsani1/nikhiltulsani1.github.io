<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 550" role="img" aria-labelledby="title desc">
<title id="title">Conceptual engineering system flow</title>
<desc id="desc">A technical illustration showing input, retrieval and agents, evaluation, and reliable delivery connected in a system workflow. It does not depict a proprietary client system.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162449"/><stop offset="1" stop-color="#0b1630"/></linearGradient>
 <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7b96ff"/><stop offset="1" stop-color="#69f0ca"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#4467d3" stop-opacity=".25"/><stop offset="1" stop-color="#4467d3" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#869dd1" stroke-opacity=".10" stroke-width="1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="660" height="550" rx="22" fill="url(#bg)"/>
<rect width="660" height="550" rx="22" fill="url(#grid)"/>
<circle cx="360" cy="260" r="270" fill="url(#halo)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <text x="38" y="50" fill="#829bd0" font-size="13" font-weight="650" letter-spacing="2">ENGINEERING SIGNAL</text>
 <circle cx="575" cy="44" r="5" fill="#6de7b9"/><text x="591" y="48" fill="#93a8c7" font-size="11">ONLINE</text>
</g>
<g stroke="url(#stroke)" stroke-width="2" fill="none" stroke-linecap="round">
 <path d="M253 178 C290 178 300 178 342 178"/><path d="M457 225 L457 293"/><path d="M353 361 C305 361 305 361 255 361"/><path d="M144 306 V224"/>
</g>
<g stroke="#8eb1ff" stroke-width="1.1" fill="none" opacity=".4">
 <path d="M253 185 C290 214 300 215 342 185"/><path d="M447 225 Q400 259 445 293"/><path d="M144 225 C90 272 110 280 144 306"/>
</g>
<g fill="#7e9cff"><circle cx="296" cy="178" r="4"/><circle cx="457" cy="264" r="4"/></g>
<g fill="#6ae7c7"><circle cx="302" cy="361" r="4"/><circle cx="144" cy="265" r="4"/></g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <g><rect x="53" y="125" width="200" height="100" rx="13" fill="#23375a" stroke="#506aa6"/>
